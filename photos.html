<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photos — Hồ Lam Sơn</title>
  <meta name="description" content="Photos by Hồ Lam Sơn.">
  <meta name="author" content="Hồ Lam Sơn">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html" lang="vi">Hồ Lam Sơn</a>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">CV</a></li>
          <li><a href="photos.html" aria-current="page">Photos</a></li>
          <li><a href="widgets.html">Teaching widgets</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="container">
      <div class="page-head">
        <h1>Photos</h1>
        <p class="lead">Select any photo to see it larger.</p>
      </div>

      <!-- The gallery is filled in by js/photos.js from the list in js/photos-data.js -->
      <ul class="gallery" id="gallery"></ul>
      <noscript><p class="gallery-empty">The photo gallery needs JavaScript to be enabled.</p></noscript>
    </div>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <div class="lightbox-inner">
      <div class="lightbox-bar">
        <span id="lightbox-count" aria-live="polite"></span>
        <button class="lightbox-button" id="lightbox-close" type="button" aria-label="Close photo viewer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="lightbox-stage" id="lightbox-stage">
        <button class="lightbox-button lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <img id="lightbox-image" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="">
        <button class="lightbox-button lightbox-next" id="lightbox-next" type="button" aria-label="Next photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <p class="lightbox-caption" id="lightbox-caption"></p>
    </div>
  </dialog>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 <span lang="vi">Hồ Lam Sơn</span></span>
      <span>Last updated October 2026</span>
    </div>
  </footer>

  <script src="js/site.js"></script>
  <script src="js/photos-data.js"></script>
  <script src="js/photos.js"></script>
</body>
</html>
